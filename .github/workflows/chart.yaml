name: Release Charts

# Publishes every chart under charts/ to the gh-pages index.
#
# Moved here from the standalone `charts` repo. The index is served from this
# repo's Pages site, so the `helm repo add` URL changes from
# https://dtandersen.github.io/charts to https://dtandersen.github.io/dockerfiles
# (or back to .../charts if this repo is later renamed). Repo rename aside,
# helm follows no redirects for repo indexes.
#
# This repo's Pages site must be set to "Deploy from a branch: gh-pages / (root)",
# which is where chart-releaser pushes index.yaml and the chart packages. With
# Pages set to "GitHub Actions" the index is never served.
#
# Chart release tags are <chart>-<version> (e.g. xestrata-0.1.1), which is why
# image releases are tagged <image>-v<version> (e.g. xestrata-vxe0.2.2-1): the
# `v` keeps the two tag namespaces from colliding, and each image workflow
# listens only to its own prefix.

on:
  push:
    branches:
      - main
    paths:
      - charts/**
      - .github/workflows/chart.yaml
  workflow_dispatch:

jobs:
  release:
    # depending on default permission settings for your org (contents being read-only or read-write for workloads), you will have to add permissions
    # see: https://docs.github.com/en/actions/security-guides/automatic-token-authentication#modifying-the-permissions-for-the-github_token
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # charts/netbird is a submodule; check it out so dependency
          # vendoring and chart-releaser see the chart contents.
          submodules: true

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      # chart-releaser diffs the live index inside a worktree of origin/gh-pages
      # and fails ("fatal: invalid reference: origin/gh-pages") when that branch
      # does not exist yet — on the first release of a new repo, or after the
      # pages branch is deleted. Create it once, empty, and let chart-releaser
      # fill it in.
      - name: Ensure gh-pages branch
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "origin/gh-pages already exists."
            exit 0
          fi
          echo "Creating an empty gh-pages branch."
          commit=$(git commit-tree "$(git hash-object -t tree /dev/null)" -m "Initialize gh-pages")
          git push origin "$commit:refs/heads/gh-pages"

      # Dependency packages (*.tgz) are not committed, so vendor them before
      # chart-releaser packages each chart.
      - name: Build chart dependencies
        run: |
          for chart in charts/*/; do
            if [ -f "${chart}Chart.yaml" ]; then
              echo "Building dependencies for ${chart}"
              helm dependency build "$chart"
            fi
          done

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          # Don't fail on a chart whose release already exists.
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
