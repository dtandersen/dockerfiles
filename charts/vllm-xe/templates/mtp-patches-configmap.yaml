{{- if (default dict .Values.mtp).enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-mtp-patches
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
data:
  entrypoint.sh: |
{{ .Files.Get "patches/entrypoint.sh" | indent 4 }}
  patch_mtp_nightly.py: |
{{ .Files.Get "patches/patch_mtp_nightly.py" | indent 4 }}
  patch_mtp_boundary.py: |
{{ .Files.Get "patches/patch_mtp_boundary.py" | indent 4 }}
  patch_gdn_mixed_split_v5.py: |
{{ .Files.Get "patches/patch_gdn_mixed_split_v5.py" | indent 4 }}
  patch_draft_lmhead_int4.py: |
{{ .Files.Get "patches/patch_draft_lmhead_int4.py" | indent 4 }}
  patch_draft_mtp_int4.py: |
{{ .Files.Get "patches/patch_draft_mtp_int4.py" | indent 4 }}
{{- end }}
