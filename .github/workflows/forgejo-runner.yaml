# Builds forgejo-runner and pushes it to GHCR.
#
# Tags: branch pushes publish the branch name (main). Release tags publish the
# upstream version and are named <image>-v<version>, e.g.
# forgejo-runner-v13.1.0 — the version part doubles as RUNNER_VERSION. The `v`
# keeps image releases apart from chart releases, which chart-releaser names
# <chart>-<version> (e.g. forgejo-runner-0.1.0, from Chart.yaml).
#
# A tag push ignores `paths:` filters, so the tag glob below is the only thing
# selecting this workflow. Without the image prefix a bare 13.1.0 would build
# every image in this repo. Keep the tag in lockstep with
# statefulset.runner.fullOverride in the helmfile
# releases/forgejo-runner-dind/values.yaml — bump both together.
#
# Auth uses the automatic GITHUB_TOKEN (no manual secrets). After the first
# push, set the package to public (ghcr.io/dtandersen → forgejo-runner →
# Package settings → Change visibility); the cluster pulls it anonymously.
# A private package would need an imagePullSecret on the runner instead.

name: forgejo-runner

on:
  push:
    branches: [main]
    tags: ['forgejo-runner-v*']
    paths:
      - images/forgejo-runner/**
      - .github/workflows/forgejo-runner.yaml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/dtandersen/forgejo-runner
  # Upstream runner version for branch builds. Release tags override this with
  # the version part of the tag (see the set-version step).
  RUNNER_VERSION: "13.1.0"

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Release tags (forgejo-runner-v13.1.0) build that runner version.
      - name: Set version from release tag
        run: echo "RUNNER_VERSION=${GITHUB_REF_NAME#forgejo-runner-v}" >> $GITHUB_ENV
        if: startsWith(github.ref, 'refs/tags/forgejo-runner-v')

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            # Release tag forgejo-runner-v13.1.0 -> image tag 13.1.0.
            type=match,pattern=forgejo-runner-v(.*),group=1
            # Fallback so manual dispatches (neither branch nor tag ref)
            # still produce a tag.
            type=sha

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: images/forgejo-runner
          push: true
          build-args: RUNNER_VERSION=${{ env.RUNNER_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
