# Builds xestrata and pushes it to GHCR. Tag pushes (e.g. xe0.2.2-1) release
# that upstream version; keep release tags in lockstep with image.tag in
# charts/xestrata/values.yaml and appVersion in charts/xestrata/Chart.yaml.
# After the first push make the ghcr package public or the cluster cannot pull it.

name: xestrata

on:
  push:
    branches: ['**']
    tags: ['[0-9]*']
    paths:
      - xestrata/**
      - .github/workflows/xestrata.yaml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/dtandersen/xestrata

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read Dockerfile defaults
        run: |
          echo "XESTRATA_REF=$(grep -m1 '^ARG XESTRATA_REF=' xestrata/Dockerfile | cut -d= -f2)" >> $GITHUB_ENV
          echo "XESTRATA_VARIANT=$(grep -m1 '^ARG XESTRATA_VARIANT=' xestrata/Dockerfile | cut -d= -f2)" >> $GITHUB_ENV

      - name: Set ref
        run: echo "XESTRATA_REF=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
        if: startsWith(github.ref, 'refs/tags/')

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - uses: docker/build-push-action@v6
        with:
          context: xestrata
          push: true
          build-args: |
            XESTRATA_REF=${{ env.XESTRATA_REF }}
            XESTRATA_VARIANT=${{ env.XESTRATA_VARIANT }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
