# CUPS bridge for Brother HL-2270DW -> Windows Protected Print / IPP Everywhere
# Listens on unprivileged 8631 so the container runs as lp (uid/gid 7, created
# by the cups package). Map to 631 externally (Service port 631 -> targetPort 8631).

ServerName 0.0.0.0
Listen 0.0.0.0:8631
Listen /tmp/cups.sock

# Stay unprivileged even if started as root (e.g. docker without --user).
# lp (uid/gid 7) is created by the cups Debian package. Auth is off (see DefaultAuthType None)
# because this is a single-purpose LAN bridge: the entrypoint must create the
# queue at boot without a password, and Windows IPP clients are unauthenticated.
User lp
Group lp

# Log to stderr so `docker logs` / kubectl logs work without /var/log writes.
ErrorLog stderr
AccessLog stderr
TempDir /tmp

Browsing On
BrowseLocalProtocols dnssd
# Advertise shared queues over DNS-SD when Avahi is reachable. NOTE: a k8s
# pod's multicast does not reach the LAN, so Windows discovery also needs the
# static Avahi file in avahi-bridge.service on a LAN host (see README).
# No auth: single-purpose bridge. NetworkPolicy / firewall restricts access
# beyond the LAN. Required so the unprivileged entrypoint (lp, uid 7) can run
# lpadmin/cupsctl at boot and Windows IPP clients need no password.
DefaultAuthType None

# Allow admin + print from anywhere in the cluster / LAN.
# Lock down further with NetworkPolicy / firewall if exposed beyond LAN.
<Location />
  Order allow,deny
  Allow all
</Location>
<Location /admin>
  Order allow,deny
  Allow all
</Location>
<Location /admin/conf>
  Order allow,deny
  Allow all
</Location>
<Location /printers>
  Order allow,deny
  Allow all
</Location>

# Share printers via IPP (this is what Windows IPP Class Driver talks to)
DefaultPolicy default
<Policy default>
  JobPrivateAccess default
  JobPrivateValues default
  SubscriptionPrivateAccess default
  SubscriptionPrivateValues default
  <Limit Create-Job Print-Job Print-URI Validate-Job>
    Order deny,allow
    Allow all
  </Limit>
  <Limit Send-Document Send-URI Hold-Job Release-Job Restart-Job Purge-Jobs Set-Job-Attributes Create-Job-Subscription Renew-Subscription Cancel-Subscription Get-Notifications Reprocess-Job Cancel-Current-Job Suspend-Current-Job Resume-Job Cancel-My-Jobs Close-Job Identify-Printer Validate-Document>
    Order deny,allow
    Allow all
  </Limit>
  <Limit CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Add-Modify-Class CUPS-Delete-Class CUPS-Set-Default CUPS-Get-Devices>
    Order deny,allow
    Allow all
  </Limit>
  <Limit Pause-Printer Resume-Printer Enable-Printer Disable-Printer Pause-Printer-After-Current-Job Hold-New-Jobs Release-Held-New-Jobs Deactivate-Printer Activate-Printer Restart-Printer Shutdown-Printer Startup-Printer Promote-Job Schedule-Job-After Cancel-Job CUPS-Accept-Jobs CUPS-Reject-Jobs>
    Order deny,allow
    Allow all
  </Limit>
  <Limit Cancel-Job CUPS-Authenticate-Job>
    Order deny,allow
    Allow all
  </Limit>
  <Limit All>
    Order deny,allow
    Allow all
  </Limit>
</Policy>
