# Builds valheim and pushes it to GHCR.
#
# Tags: branch pushes publish the branch name (main) and, for the default
# branch, `latest`. Release tags publish the version and are named
# <image>-v<version>, e.g. valheim-v1.0.0 — then bump `image.tag` (and
# appVersion) in charts/valheim to that tag. The `v` keeps image releases
# apart from chart releases, which chart-releaser names <chart>-<version>
# (e.g. valheim-0.1.1, from Chart.yaml).
#
# A tag push ignores `paths:` filters, so the tag glob below is the only thing
# selecting this workflow. Without the image prefix a bare 1.0.0 would build
# every image in this repo.
#
# The image name stays `valheim` (not `valheim-docker`), so the package,
# ghcr.io/dtandersen/valheim, is the same one the retired valheim-docker repo
# published to; charts/valheim keeps pulling it unchanged.
#
# linux/amd64 only: SteamCMD and the Valheim server binary are x86, and the
# game files SteamCMD installs at runtime are too.
#
# Auth uses the automatic GITHUB_TOKEN (no manual secrets). The package must be
# public (ghcr.io/dtandersen → valheim → Package settings → Change visibility);
# the cluster pulls it anonymously. A private package would need an
# imagePullSecret on the workload instead.

name: valheim

on:
  push:
    branches: [main]
    tags: ['valheim-v*']
    paths:
      - images/valheim/**
      - .github/workflows/valheim.yaml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/dtandersen/valheim

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # main stays the rolling tag charts/valheim pins, latest is kept
            # for anyone pulling the tag the valheim-docker repo published.
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            # Release tag valheim-v1.0.0 -> image tag 1.0.0.
            type=match,pattern=valheim-v(.*),group=1
            # Fallback so manual dispatches (neither branch nor tag ref)
            # still produce a tag.
            type=sha,format=short

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: images/valheim
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
