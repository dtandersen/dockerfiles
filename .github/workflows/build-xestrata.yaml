# Builds xestrata and pushes it to GHCR.
#
# Runs on pushes to main touching this image (or the workflow itself), plus
# manual dispatch. The tag here must stay in lockstep with
# image.tag in the charts repo charts/xestrata/values.yaml and
# appVersion in charts/xestrata/Chart.yaml — bump all three together.
#
# Auth uses the automatic GITHUB_TOKEN (no manual secrets). After the first
# push, set the package to public (ghcr.io/dtandersen → xestrata →
# Package settings → Change visibility); the cluster pulls it anonymously.
# A private package would need an imagePullSecret on the workload instead.

name: build-xestrata

on:
  push:
    branches: [main]
    paths:
      - xestrata/**
      - .github/workflows/build-xestrata.yaml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/dtandersen/xestrata
  TAG: "xe0.1.43.1"

jobs:
  build-push:
    runs-on: ubuntu-latest
    # intel/llvm + engine from source take a long time on a small runner.
    timeout-minutes: 300
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: xestrata
          push: true
          # Single source of truth for the XeStrata version; the chart's
          # image.tag and Chart.yaml appVersion must match this TAG.
          build-args: XESTRATA_REF=${{ env.TAG }}
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
