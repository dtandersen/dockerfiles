# Builds hl2270dw-ipp-bridge and pushes it to GHCR.
#
# Tags: branch pushes publish the branch name (main). Release tags publish the
# version and are named <image>-v<version>, e.g.
# hl2270dw-ipp-bridge-v1.0.0 — then bump `image.tag` (and appVersion) in
# charts/hl2270dw-ipp-bridge to that tag. The `v` keeps image releases
# apart from chart releases, which chart-releaser names <chart>-<version>
# (e.g. hl2270dw-ipp-bridge-0.1.1, from Chart.yaml).
#
# A tag push ignores `paths:` filters, so the tag glob below is the only thing
# selecting this workflow. Without the image prefix a bare 1.0.0 would build
# every image in this repo.
#
# Auth uses the automatic GITHUB_TOKEN (no manual secrets). After the first
# push, set the package to public (ghcr.io/dtandersen → hl2270dw-ipp-bridge →
# Package settings → Change visibility); the cluster pulls it anonymously.
# A private package would need an imagePullSecret on the workload instead.

name: hl2270dw-ipp-bridge

on:
  push:
    branches: [main]
    tags: ['hl2270dw-ipp-bridge-v*']
    paths:
      - images/hl2270dw-ipp-bridge/**
      - .github/workflows/hl2270dw-ipp-bridge.yaml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/dtandersen/hl2270dw-ipp-bridge

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            # Release tag hl2270dw-ipp-bridge-v1.0.0 -> image tag 1.0.0.
            type=match,pattern=hl2270dw-ipp-bridge-v(.*),group=1
            # Fallback so manual dispatches (neither branch nor tag ref)
            # still produce a tag.
            type=sha

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: images/hl2270dw-ipp-bridge
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
