# Builds xestrata-llvm and pushes it to GHCR. Tag pushes (e.g. xe0.1.43.1)
# build that upstream version. After the first push make the ghcr package
# public or the cluster cannot pull it.

name: xestrata-llvm

on:
  push:
    branches: ['**']
    tags: ['[0-9]*']
    paths:
      - xestrata-llvm/**
      - .github/workflows/xestrata-llvm.yaml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/dtandersen/xestrata-llvm
  XESTRATA_REF: "xe0.1.43.1"

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set ref
        run: echo "XESTRATA_REF=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
        if: startsWith(github.ref, 'refs/tags/')

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - uses: docker/build-push-action@v6
        with:
          context: xestrata-llvm
          push: true
          # 8G: GHA cache caps at 10 GB; 30G Dockerfile default is for local builds.
          build-args: |
            XESTRATA_REF=${{ env.XESTRATA_REF }}
            CCACHE_MAXSIZE=8G
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
