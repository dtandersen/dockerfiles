# Builds xestrata and pushes it to GHCR.
#
# The image tag follows the push: branch name for branches (main), tag name
# for tags. Push a tag like xe0.1.43.1 to release that upstream version — the
# tag doubles as XESTRATA_REF (resolved to the release's .deb via its
# SHA256SUMS). Release tags must stay in lockstep with image.tag in the
# charts repo charts/xestrata/values.yaml and appVersion in
# charts/xestrata/Chart.yaml — bump all three together.
#
# Auth uses the automatic GITHUB_TOKEN (no manual secrets). After the first
# push, set the package to public (ghcr.io/dtandersen → xestrata →
# Package settings → Change visibility); the cluster pulls it anonymously.
# A private package would need an imagePullSecret on the workload instead.

name: xestrata

on:
  push:
    branches: ['**']
    tags: ['[0-9]*']
    paths:
      - xestrata/**
      - .github/workflows/xestrata.yaml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/dtandersen/xestrata
  # Upstream git tag baked into branch builds. Tag pushes override this
  # with the tag name (see set-ref step).
  XESTRATA_REF: "xe0.1.43.1"
  # Upstream package variant (see Dockerfile).
  XESTRATA_VARIANT: "contrib-cuda13.1"

jobs:
  build-push:
    runs-on: ubuntu-latest
    # .deb install, no source build.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Tag pushes (xe0.1.43.1) install that upstream version.
      - name: Set ref
        run: echo "XESTRATA_REF=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
        if: startsWith(github.ref, 'refs/tags/')

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            # Fallback so manual dispatches (neither branch nor tag ref)
            # still produce a tag.
            type=sha

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The GHA cache backend cannot export on the default docker driver.
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - uses: docker/build-push-action@v6
        with:
          context: xestrata
          push: true
          build-args: |
            XESTRATA_REF=${{ env.XESTRATA_REF }}
            XESTRATA_VARIANT=${{ env.XESTRATA_VARIANT }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
