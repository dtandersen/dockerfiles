# Builds forgejo-runner and pushes it to GHCR.
#
# The image tag follows the push: branch name for branches (main), tag name
# for tags. Push a version tag like 13.1.0 to release that runner version —
# the tag doubles as RUNNER_VERSION. It must stay in lockstep with
# statefulset.runner.fullOverride in the helmfile
# releases/forgejo-runner-dind/values.yaml — bump both together.
#
# Auth uses the automatic GITHUB_TOKEN (no manual secrets). After the first
# push, set the package to public (ghcr.io/dtandersen → forgejo-runner →
# Package settings → Change visibility); the cluster pulls it anonymously.
# A private package would need an imagePullSecret on the runner instead.

name: forgejo-runner

on:
  push:
    branches: [main]
    tags: ['[0-9]*']
    paths:
      - forgejo-runner/**
      - .github/workflows/forgejo-runner.yaml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/dtandersen/forgejo-runner
  # Upstream runner version for branch builds. Tag pushes override this
  # with the tag name (see set-ref step).
  RUNNER_VERSION: "13.1.0"

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Version tags (13.1.0) build that runner version.
      - name: Set ref
        run: echo "RUNNER_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
        if: startsWith(github.ref, 'refs/tags/')

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            # Fallback so manual dispatches (neither branch nor tag ref)
            # still produce a tag.
            type=sha

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: forgejo-runner
          push: true
          build-args: RUNNER_VERSION=${{ env.RUNNER_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
